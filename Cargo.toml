[workspace]
resolver = "2"
members = [
    "crates/perch-proto",
    "crates/perch-tracking",
    "crates/perch-space",
    "crates/perch-hal",
    "crates/perch-net",
    "crates/perch-input",
    "crates/perch-capture",
    "crates/perch-ui",
    "crates/perch-compositor",
    "crates/perch-daemon",
    "crates/perch-cli",
    "crates/perch-ffi",
]

# Crates that need hardware/GPU/OS libraries are NOT built by a plain
# `cargo build`. Use `just build-full` or `cargo build --workspace`.
# The default set is what CI runs on every PR and what Claude Code should
# run to validate pure-logic changes.
default-members = [
    "crates/perch-proto",
    "crates/perch-tracking",
    "crates/perch-space",
    "crates/perch-ui",
    "crates/perch-net",
    "crates/perch-hal",
    "crates/perch-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Aashique <aashiquear@gmail.com>"]
repository = "https://github.com/aashiquear/perch"
homepage = "https://github.com/aashiquear/perch"
description = "Perch: 3DOF multi-window spatial desktop for Rokid Max (and friends) across Linux, Android, Windows, macOS, iPad"

[workspace.dependencies]
# -- internal
perch-proto = { path = "crates/perch-proto" }
perch-tracking = { path = "crates/perch-tracking" }
perch-space = { path = "crates/perch-space" }
perch-hal = { path = "crates/perch-hal" }
perch-net = { path = "crates/perch-net" }
perch-input = { path = "crates/perch-input" }
perch-capture = { path = "crates/perch-capture" }
perch-ui = { path = "crates/perch-ui" }
perch-compositor = { path = "crates/perch-compositor" }

# -- math / data
nalgebra = { version = "0.33", default-features = false, features = ["std", "serde-serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"

# -- async / net
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
mdns-sd = "0.13"

# -- logging / cli
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
toml = "0.8"

# -- hardware
# Open-source Rokid Air/Max driver (MIT) by Alex Badics. Rokid backend uses rusb only.
ar-drivers = { version = "0.4", default-features = false, features = ["rokid", "bytemuck"] } # bytemuck: upstream rokid feature omits it
rusb = { version = "0.9", features = ["vendored"] }

# -- graphics / windowing (compositor only)
wgpu = "24"
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
