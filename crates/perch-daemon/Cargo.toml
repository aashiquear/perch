[package]
name = "perch-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "perchd — the Perch host daemon: glasses hotplug, tracking, spatial window engine, control server, compositor"

[[bin]]
name = "perchd"
path = "src/main.rs"

[features]
# Headless by default so `cargo build` works on CI and on machines without a GPU.
default = []
# Real Rokid hardware.
rokid = ["perch-hal/rokid"]
# Open a window on the glasses and draw (needs a GPU + display server).
render = ["dep:perch-compositor", "dep:winit", "dep:egui", "dep:egui-wgpu", "dep:egui-winit", "dep:wgpu", "dep:pollster", "dep:png"]
# Linux screen/window capture via xdg-desktop-portal + PipeWire (needs libpipewire-0.3-dev).
linux-pipewire = ["perch-capture/linux-pipewire"]
# Linux keyboard/mouse injection + capture.
linux-input = ["perch-input/linux-evdev"]
full-linux = ["rokid", "render", "linux-input", "linux-pipewire"]

[dependencies]
perch-proto.workspace = true
perch-tracking.workspace = true
perch-space.workspace = true
perch-hal.workspace = true
perch-net.workspace = true
perch-input.workspace = true
perch-compositor = { workspace = true, optional = true }
perch-capture.workspace = true
perch-ui.workspace = true
winit = { workspace = true, optional = true }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
directories.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
uuid.workspace = true
nalgebra.workspace = true
egui = { version = "0.31", optional = true }
egui-wgpu = { version = "0.31", optional = true }
egui-winit = { version = "0.31", optional = true, default-features = false, features = ["links", "wayland", "x11"] }
wgpu = { workspace = true, optional = true }
chrono = "0.4"
pollster = { version = "0.4", optional = true }
png = { version = "0.17", optional = true }
