[package]
name = "perch-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Screen/window capture sources that feed the compositor: PipeWire (Linux), WGC (Windows), ScreenCaptureKit (macOS), MediaProjection (Android via FFI), plus a test pattern"

[features]
default = []
# Linux: xdg-desktop-portal ScreenCast → PipeWire. Needs libpipewire-0.3-dev.
linux-pipewire = ["dep:ashpd", "dep:pipewire", "dep:tokio", "dep:futures-util"]
windows-wgc = []
macos-sck = []

[dependencies]
perch-proto.workspace = true
perch-input.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.10", optional = true }
pipewire = { version = "0.8", optional = true }
tokio = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
