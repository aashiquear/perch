[package]
name = "perch-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "perch — command-line controller for perchd (status, recenter, calibrate, windows, layouts, recording)"

[[bin]]
name = "perch"
path = "src/main.rs"

[features]
default = []
rokid = ["perch-hal/rokid"]

[dependencies]
perch-proto.workspace = true
perch-net.workspace = true
perch-hal.workspace = true
perch-tracking.workspace = true
tokio.workspace = true
clap.workspace = true
serde_json.workspace = true
anyhow.workspace = true
uuid.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
