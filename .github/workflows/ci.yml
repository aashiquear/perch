name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy (default members)
        run: cargo clippy -- -D warnings
      - name: test (headless, no hardware)
        run: cargo test
      - name: check full-linux daemon (rokid + render + input)
        run: |
          sudo apt-get update && sudo apt-get install -y libudev-dev libpipewire-0.3-dev libclang-dev
          cargo check -p perch-daemon --features full-linux
      - name: check ffi with rokid
        run: cargo check -p perch-ffi --features rokid
      - name: test compositor & capture (link only; no GPU needed for unit tests)
        run: cargo test -p perch-compositor -p perch-capture
  # Android is staged (see docs/ROADMAP.md); this job must never block a
  # Linux release. The ubuntu-24.04 image ships an Android SDK at
  # $ANDROID_HOME, so no setup action is needed (android-actions/setup-android
  # currently fails on it with a license prompt).
  android-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk
      - name: NDK + CMake (runner SDK, licences accepted)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: build + unit tests (Postcard parity)
        working-directory: apps/android
        run: gradle assembleDebug testDebugUnitTest --no-daemon
