name: release
on:
  push:
    tags: ["v*"]
  # Manual run: builds the iPad IPA only. With `tag`, the sources of that tag
  # are built and the IPA is attached to its existing release; without, the
  # IPA is kept as a run artifact (to try the job).
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build the iPad IPA for and attach it to (empty: build the chosen branch, artifact only)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  linux-x86_64:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libpipewire-0.3-dev libclang-dev \
            libwayland-dev libxkbcommon-dev
      - name: build
        run: cargo build --release -p perch-daemon -p perch-cli --features perch-daemon/full-linux
      - name: package
        run: |
          v="${GITHUB_REF_NAME}"
          d="perch-${v}-linux-x86_64"
          mkdir -p "$d"
          cp target/release/perchd target/release/perch "$d"/
          cp -r udev README.md LICENSE* "$d"/ 2>/dev/null || true
          cp docs/UX.md docs/LINUX.md "$d"/
          tar czf "$d.tar.gz" "$d"
          sha256sum "$d.tar.gz" > "$d.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            perch-*-linux-x86_64.tar.gz
            perch-*-linux-x86_64.tar.gz.sha256
          generate_release_notes: true

  android:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk
      - name: NDK + CMake (runner SDK, licences accepted)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: build debug APK + unit tests
        working-directory: apps/android
        run: gradle assembleDebug testDebugUnitTest --no-daemon
      - name: package
        run: |
          v="${GITHUB_REF_NAME}"
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk "perch-${v}-android-debug.apk"
          sha256sum "perch-${v}-android-debug.apk" > "perch-${v}-android-debug.apk.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            perch-*-android-debug.apk
            perch-*-android-debug.apk.sha256

  # iPad: an *unsigned* IPA. Apple only runs apps signed for the owner's own
  # account, so the release cannot carry a signed one; `xtool install <ipa>`
  # (Linux, Windows, macOS), AltStore or Sideloadly sign it with your Apple ID
  # as they install. Built with the same tool as locally (xtool, SwiftPM), on
  # a Mac runner because the iOS SDK may not be redistributed to Linux CI.
  ipad:
    runs-on: macos-15
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
      XTOOL_VERSION: "1.24.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-ios }
      - uses: Swatinem/rust-cache@v2
      - name: Rust core for iOS (static library)
        run: cargo rustc -p perch-ffi --release --target aarch64-apple-ios --crate-type staticlib
      - name: xtool
        run: |
          curl -fsSL -o xtool.app.zip "https://github.com/xtool-org/xtool/releases/download/${XTOOL_VERSION}/xtool.app.zip"
          unzip -q xtool.app.zip -d "$RUNNER_TEMP/xtool"
          bin="$(find "$RUNNER_TEMP/xtool" -type f -name xtool -perm +111 | head -1)"
          test -n "$bin" || { echo "no xtool binary in the archive"; find "$RUNNER_TEMP/xtool" | head -50; exit 1; }
          echo "XTOOL=$bin" >> "$GITHUB_ENV"
          "$bin" --version
          xcodebuild -version
      - name: core tests
        working-directory: apps/ipad
        run: PERCH_CORE_ONLY=1 swift test
      - name: build the app (unsigned)
        working-directory: apps/ipad
        run: |
          "$XTOOL" dev build --ipa --configuration release
          cp xtool/Perch.ipa "$GITHUB_WORKSPACE/perch-${VERSION}-ipad-unsigned.ipa"
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 "perch-${VERSION}-ipad-unsigned.ipa" > "perch-${VERSION}-ipad-unsigned.ipa.sha256"
          unzip -l "perch-${VERSION}-ipad-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: perch-ipad-unsigned
          path: |
            perch-*-ipad-unsigned.ipa
            perch-*-ipad-unsigned.ipa.sha256
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || inputs.tag != ''
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            perch-*-ipad-unsigned.ipa
            perch-*-ipad-unsigned.ipa.sha256

